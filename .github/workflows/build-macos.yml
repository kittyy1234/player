name: Build KittyPlayer DMG
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build universal app + DMG
        run: |
          chmod +x KittyPlayer/build.sh
          cd KittyPlayer
          ./build.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyPlayer-dmg
          path: KittyPlayer/build/KittyPlayer.dmg
          if-no-files-found: error
      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyPlayer-app
          path: KittyPlayer/build/KittyPlayer.app
          if-no-files-found: error
      - name: Attach DMG to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KittyPlayer/build/KittyPlayer.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
