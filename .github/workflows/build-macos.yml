name: Build KittyPlayer DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app + DMG
        working-directory: KittyPlayer/KittyPlayer
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyPlayer-dmg
          path: KittyPlayer/KittyPlayer/build/KittyPlayer.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: KittyPlayer/KittyPlayer/build/KittyPlayer.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
